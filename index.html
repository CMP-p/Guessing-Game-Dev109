        // The only UX is a prompt menu Nothing displayed on the DOM

        // Gerate a random number. 
        // prompt "Guess a Number between 1 and 10."

        // prompt "You guessed it in numberOfGuesses guesses!"
        // prompt "Would you like to go again?"
        let continueGuessing = true;
        let randomNumber;
        let userGuess;
        let numberOfGuesses = 0;
        while (continueGuessing) {
            randomNumber =  Math.floor(Math.random() * 10) +1;
            console.log('randomNumber generated')
            userGuess = prompt('Guess a Number between 1 and 10.')
            numberOfGuesses ++
            while (userGuess !== randomNumber) {
                if (userGuess > randomNumber){
                    prompt('Your guess was too high, guess again.')
                }
                else if (userGuess < randomNumber) {
                    prompt('Your guess was too low, guess again.')
                }
                else {
                    console.error('program error')
                    alert('program error')
                }
            }
            prompt(`You guessed it in numberOfGuesses guesses!`) // Matches UX design
            continueGuessing = prompt('Would you like to go again?')
        }
