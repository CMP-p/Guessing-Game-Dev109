        let continueGuessing = true;
        let randomNumber;
        let userGuess;
        let numberOfGuesses = 0;
        while (continueGuessing) {
            numberOfGuesses = 0;
            randomNumber =  Math.floor(Math.random() * 10) +1;
            userGuess = prompt('Guess a Number between 1 and 10.');

            while (true) {
                numberOfGuesses ++
                if (userGuess > randomNumber){ // implicit conversion?
                    userGuess = prompt('Your guess was too high, guess again.')
                }
                else if (userGuess < randomNumber) {
                    userGuess = prompt('Your guess was too low, guess again.')
                }
                else {
                    prompt(`You guessed it in ${numberOfGuesses} guesses!`) // Matches UX design
                    break
                }
            }

            while (continueGuessing){     
                continueGuessing = prompt('Would you like to go again? y/n').toLowerCase()
                if (continueGuessing == 'y'){
                    continueGuessing = true;
                    break
                }
                else if (continueGuessing === 'n') {
                    continueGuessing = false
                }
                else {
                    alert('please type y or n')
                    continueGuessing = true;
                }
            }
        }
