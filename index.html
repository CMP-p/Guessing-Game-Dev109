    <script>
        // The only UX is a prompt menu Nothing displayed on the DOM
        // Below is my drawing, although, it's in the form of psuedo code.
        
        // Gerate a random number. 
        // collect first guess
        // prompt "Guess a Number between 1 and 10."
            // increase counter
            // collect another guess
                //is too low, guesss again ((prompt "Your guess was too low, guess again."))
                //is too high, guess again
                //is correct, move on ((prompt "You guessed it in numberOfGuesses guesses!"))
            // Ask user if they want to try again (( prompt "Would you like to go again?"))
                // if y, repeat game
                // if n, end game
                // if invalid, ask again

        let continueGuessing = true;
        let randomNumber;
        let userGuess;
        let numberOfGuesses = 0;
        while (continueGuessing) {
            numberOfGuesses = 0;
            randomNumber =  Math.floor(Math.random() * 10) +1;
            userGuess = prompt('Guess a Number between 1 and 10.');

            while (true) {
                numberOfGuesses ++
                if (userGuess > randomNumber){ // implicit conversion?
                    userGuess = prompt('Your guess was too high, guess again.')
                }
                else if (userGuess < randomNumber) {
                    userGuess = prompt('Your guess was too low, guess again.')
                }
                else {
                    prompt(`You guessed it in ${numberOfGuesses} guesses!`) // Matches UX design
                    break
                }
            }

            while (continueGuessing){     
                continueGuessing = prompt('Would you like to go again? y/n').toLowerCase()
                if (continueGuessing == 'y'){
                    continueGuessing = true;
                    break
                }
                else if (continueGuessing === 'n') {
                    continueGuessing = false
                }
                else {
                    alert('please type y or n')
                    continueGuessing = true;
                }
            }
        }
        /*Bonus: Use nested loops to allow the game to repeat until the user decides not to play again. (included)*/
    </script>
